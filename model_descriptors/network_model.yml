name: "Example Model Descriptor"
interface: eth0
entities:
  -
      name: Alice
      protocol: tcp
      hw_address: "AA:AA:AA:AA:AA:AA"
      ip: 10.0.0.1
      port: 50001
  -
      name: Bob
      protocol: udp
      hw_address: "BB:BB:BB:BB:BB:BB"
      ip: 10.0.0.2
      port: 50002

sessions:
  -
      session_name: example1
      template: "custom"
      messages:
        - "Alice->Bob | Hello"
        - "Bob->Alice | Hi"
